name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      run_full_build:
        description: 'Enable full system build (slow). Use "true" to enable.'
        required: false
        default: 'false'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        run: |
          curl -L https://nixos.org/nix/install | sh -s -- --no-daemon
          . "$HOME/.nix-profile/etc/profile.d/nix.sh"
          nix --version

      - name: Nix flake check
        run: |
          nix --extra-experimental-features 'nix-command flakes' flake check

      - name: Eval panther configuration (fast)
        run: |
          nix --extra-experimental-features 'nix-command flakes' eval --raw .#nixosConfigurations.panther

      - name: Optional full system build (disabled by default)
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_build == 'true') || env.RUN_FULL_BUILD == '1' }}
        run: |
          echo "RUN_FULL_BUILD is enabled — building panther system (may be slow)"
          nix --extra-experimental-features 'nix-command flakes' build .#nixosConfigurations.panther.config.system.build.toplevel --no-link

      - name: Run formatter & linters
        run: |
          nix --extra-experimental-features 'nix-command flakes' shell nixpkgs#nixfmt-tree nixpkgs#statix nixpkgs#deadnix --command bash -lc '
            set -euo pipefail
            echo "Running nixfmt-tree --check"; nixfmt-tree --check .
            echo "Running statix check"; statix check .
            echo "Running deadnix"; deadnix .
          '
