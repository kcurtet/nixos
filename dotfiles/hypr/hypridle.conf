# ============================================================================
# Hypridle — Idle daemon for Hyprland
# ============================================================================
# Lock screen after 15 minutes, suspend after 1 hour of inactivity.

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid locking if already locked
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn screen back on after wake
    ignore_dbus_inhibit = false                 # respect inhibitor locks
}

listener {
    timeout = 900                                # 15 minutes
    on-timeout = loginctl lock-session           # lock screen
}

listener {
    timeout = 1800                               # 30 minutes
    on-timeout = hyprctl dispatch dpms off       # turn off screen
    on-resume = hyprctl dispatch dpms on         # turn on screen
}

listener {
    timeout = 3600                               # 1 hour
    on-timeout = systemctl suspend               # suspend system
}
