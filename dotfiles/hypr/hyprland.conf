# ============================================================================
# Hyprland Configuration
# ============================================================================

# ── Environment variables ──
# PATH is managed by home.sessionPath in Home Manager

# Wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# NVIDIA — set conditionally via specialisation, not hardcoded here

# Cursor
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Classic

# Monitor configuration
# monitor=eDP-1,1920x1080@144,0x0,1
monitor = eDP-1, disable

# Execute on startup
exec-once = hyprpaper
exec-once = waybar
exec-once = dunst
exec-once = nm-applet --indicator
exec-once = hyprctl setcursor Bibata-Modern-Classic 24

# Input device configuration
input {
    kb_layout = es
    kb_variant = cat
    follow_mouse = 1

    touchpad {
        natural_scroll = yes
        disable_while_typing = yes
        tap-to-click = yes
    }

    sensitivity = 0
}

# General settings
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(81a1c1ee) rgba(88c0d0ee) 45deg
    col.inactive_border = rgba(4c566a80)
    layout = dwindle
}

# Decoration
decoration {
    rounding = 8
    blur {
        enabled = yes
        size = 3
        passes = 2
    }
}

# Animations
animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = borderangle, 1, 30, default, loop
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# Dwindle layout
dwindle {
    pseudotile = yes
    preserve_split = yes
}

# ============================================================================
# Keybindings — $mod = Super
# ============================================================================
$mod = SUPER

# ── Help ──
bind = $mod, F1, exec, ~/.config/hypr/scripts/keybinds.sh

# ── Apps ──
bind = $mod, Return, exec, foot -e tmux
bind = $mod+SHIFT, Return, exec, foot 
bind = $mod, D, exec, rofi -show drun -show-icons -theme ~/.config/rofi/nord.rasi
bind = $mod, E, exec, ghostty -e yazi
bind = $mod+ALT, E, exec, thunar
bind = $mod, B, exec, brave

# ── Window management ──
bind = $mod, Q, killactive,
bind = $mod+SHIFT, Q, exec, hyprctl kill
bind = $mod, F, fullscreen, 1
bind = $mod+SHIFT, F, fullscreen, 0
bind = $mod, SPACE, togglefloating,
bind = $mod, V, togglesplit,
bind = $mod, T, pseudo,
bind = $mod, G, togglegroup,

# ── Screen lock ──
bind = $mod, Escape, exec, swaylock

# ── Color picker ──
bind = $mod, C, exec, hyprpicker -a

# ── Focus (Super + hjkl / arrows) ──
bind = ALT, H, movefocus, l
bind = ALT, J, movefocus, d
bind = ALT, K, movefocus, u
bind = ALT, L, movefocus, r
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# ── Move window (Super+Shift + hjkl / arrows) ──
bind = $mod+SHIFT, H, movewindow, l
bind = $mod+SHIFT, J, movewindow, d
bind = $mod+SHIFT, K, movewindow, u
bind = $mod+SHIFT, L, movewindow, r
bind = $mod+SHIFT, left, movewindow, l
bind = $mod+SHIFT, right, movewindow, r
bind = $mod+SHIFT, up, movewindow, u
bind = $mod+SHIFT, down, movewindow, d

# ── Resize (Super+Alt + hjkl / arrows, repeat on hold) ──
binde = $mod ALT, H, resizeactive, -20 0
binde = $mod ALT, L, resizeactive, 20 0
binde = $mod ALT, K, resizeactive, 0 -20
binde = $mod ALT, J, resizeactive, 0 20
binde = $mod ALT, left, resizeactive, -20 0
binde = $mod ALT, right, resizeactive, 20 0
binde = $mod ALT, up, resizeactive, 0 -20
binde = $mod ALT, down, resizeactive, 0 20

# ── Workspaces ──
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# ── Move to workspace ──
bind = $mod+SHIFT, 1, movetoworkspace, 1
bind = $mod+SHIFT, 2, movetoworkspace, 2
bind = $mod+SHIFT, 3, movetoworkspace, 3
bind = $mod+SHIFT, 4, movetoworkspace, 4
bind = $mod+SHIFT, 5, movetoworkspace, 5
bind = $mod+SHIFT, 6, movetoworkspace, 6
bind = $mod+SHIFT, 7, movetoworkspace, 7
bind = $mod+SHIFT, 8, movetoworkspace, 8
bind = $mod+SHIFT, 9, movetoworkspace, 9
bind = $mod+SHIFT, 0, movetoworkspace, 10

# ── Workspace navigation ──
bind = $mod, Tab, workspace, e+1
bind = $mod+SHIFT, Tab, workspace, e-1
bind = $mod, grave, workspace, previous

# ── Scratchpad ──
bind = $mod, S, togglespecialworkspace, magic
bind = $mod+SHIFT, S, movetoworkspace, special:magic

# ── Screenshots ──
bind = $mod+SHIFT, P, exec, f=~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png && grim -g "$(slurp)" "$f" && wl-copy < "$f"
bind = $mod, P, exec, f=~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png && grim "$f" && wl-copy < "$f"
bind = , Print, exec, grim ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png

# ── Alarms ──
bind = $mod, A, exec, ~/.config/hypr/scripts/alarm.sh menu
bind = $mod+SHIFT, A, exec, ~/.config/hypr/scripts/alarm.sh quick

# ── Exit Hyprland ──
bind = $mod+SHIFT, E, exec, ~/.config/hypr/scripts/powermenu.sh

# ── Media keys ──
bindel = , XF86AudioRaiseVolume, exec, pamixer --increase 5
bindel = , XF86AudioLowerVolume, exec, pamixer --decrease 5
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioMute, exec, pamixer --toggle
bindl = , XF86AudioMicMute, exec, pamixer --default-source --toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# ── Mouse ──
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Window rules ──
windowrule = float on, match:class pavucontrol
windowrule = float on, match:class nm-connection-editor
windowrule = float on, match:class blueman-manager
windowrule = float on, match:class org.gnome.Calculator
windowrule = size 800 600, match:class pavucontrol
windowrule = center 1, match:class pavucontrol

# Source additional configs
source = ~/.config/hypr/hyprpaper.conf
