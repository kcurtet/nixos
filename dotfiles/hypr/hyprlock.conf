# ============================================================================
# Hyprlock Configuration
# Nord-themed screen lock for Hyprland
# ============================================================================

# ── General ──
general {
    grace = 0
    hide_cursor = true
}

# ── Animations ──
animations {
    enabled = true
}

# ── Background (screenshot with blur) ──
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.05
    color = rgba(46, 52, 64, 1.0)
}

# ── Time ──
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(236, 239, 244, 1.0)
    font_size = 120
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ── Date ──
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A, %B %d')"
    color = rgba(136, 192, 208, 1.0)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

# ── User greeting ──
label {
    monitor =
    text = Hi there, $USER
    color = rgba(216, 222, 233, 1.0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -80
    halign = center
    valign = center
}

# ── Input field ──
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(94, 129, 172, 1.0)
    inner_color = rgba(46, 52, 64, 0.8)
    font_color = rgba(236, 239, 244, 1.0)

    fade_on_empty = true
    fade_timeout = 3000
    placeholder_text = <i><span foreground="##5e81ac">🔒</span>  Enter Password</i>
    hide_input = false

    rounding = 10

    check_color = rgba(163, 190, 140, 1.0)
    fail_color = rgba(191, 97, 106, 1.0)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    position = 0, -160
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ── Auth failure label ──
label {
    monitor =
    text = $ATTEMPTS[<i>Authentication failed</i>]
    color = rgba(191, 97, 106, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -120
    halign = center
    valign = center
}
