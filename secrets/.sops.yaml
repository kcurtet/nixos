# ============================================================================
# SOPS Configuration
# This file defines which keys can encrypt/decrypt secrets
# ============================================================================
#
# SETUP INSTRUCTIONS:
# 1. Generate an age key (if you don't have one):
#    $ nix-shell -p age --run "age-keygen -o ~/.config/sops/age/keys.txt"
#
# 2. Get your public key:
#    $ nix-shell -p age --run "age-keygen -y ~/.config/sops/age/keys.txt"
#
# 3. Replace the example key below with your public key
#
# 4. Create your first secret:
#    $ cd secrets
#    $ sops secrets.yaml
#
# 5. Add the secret to your NixOS config:
#    sops.secrets.my-secret = {};
#
# For more information, see: https://github.com/Mic92/sops-nix
# ============================================================================

keys:
  # Replace this with your actual age public key
  # Example: age1qyqszqrcq6x8l5z7w9e3v4b5n6m7k8j9h0g1f2d3e4c5b6a7n8m9k0j1h2g3f
  - &user "age1dazq4xdjddesxclv57kmqxsf8m34vmcx4hx52qwp98fcpjcdfqpqvff0lg"

creation_rules:
  # Encrypt all secrets files for the user key above
  - path_regex: secrets\.yaml$
    key_groups:
      - age:
          - *user
